plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.2'
  id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.medstorm'
version = '0.0.1-SNAPSHOT'

java {
  sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
  mavenCentral()
  // ONLY the dirs you actually want to source local jars from:
flatDir { dirs 'libs', 'libs/sdc-6.0.0', 'libs/legacy' }
}

configurations.configureEach {
  resolutionStrategy {
    force 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
    force 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
    force 'jakarta.activation:jakarta.activation-api:2.1.3'
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'javax.inject:javax.inject:1'
  implementation 'com.google.code.findbugs:jsr305:3.0.2'
  implementation 'org.jspecify:jspecify:1.0.0'
  implementation 'javax.annotation:javax.annotation-api:1.3.2'

  // Apache HttpClient 4.x (SDCri DPWS expects org.apache.http.client.HttpClient)
implementation 'org.apache.httpcomponents:httpclient:4.5.14'
implementation 'org.apache.httpcomponents:httpcore:4.4.16'


  implementation 'com.google.inject:guice:5.1.0'
implementation 'com.google.inject.extensions:guice-assistedinject:5.1.0'
implementation 'com.google.guava:guava:32.1.3-jre'

// Jetty (needed because you compile against Jetty classes; Spring Boot uses Tomcat by default)
implementation platform('org.eclipse.jetty:jetty-bom:11.0.24')
implementation 'org.eclipse.jetty:jetty-util'
implementation 'org.eclipse.jetty:jetty-server'
implementation 'org.eclipse.jetty:jetty-http'
implementation 'org.eclipse.jetty:jetty-io'
implementation 'org.eclipse.jetty:jetty-security'


  // Jakarta JAXB runtime
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
  implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
  implementation 'jakarta.activation:jakarta.activation-api:2.1.3'

  // ✅ ONLY SDC 6.0.0 jars from libs/sdc-6.0.0
  // (Filter down to *-6.0.0.jar so nothing else can slip in)
  implementation fileTree(dir: 'libs/sdc-6.0.0', include: ['*-6.0.0.jar'], exclude: [
    'jaxb2-basics-*.jar', 'jaxb2-basics-runtime-*.jar', 'jaxb-*.jar', 'javax.xml.bind*'
  ])

  // ✅ legacy basics runtime (only this one)
  implementation name: 'jaxb2-basics-runtime-0.6.4'

  // compile-time only for javax.* references in shims
  compileOnly 'javax.xml.bind:jaxb-api:2.3.1'
  runtimeOnly 'javax.xml.bind:jaxb-api:2.3.1'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('bootJar') {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

//
// ✅ Build-time guard: fail if bootJar contains any non-6.0.0 SDC jars
//
tasks.register('verifyBootLibs') {
  dependsOn tasks.named('bootJar')
  doLast {
    def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile
    def libs = zipTree(jarFile).matching { include 'BOOT-INF/lib/*.jar' }.files.collect { it.name }

    def suspects = libs.findAll { n ->
      n.toLowerCase().contains('sdc') ||
      n.toLowerCase().contains('dpws') ||
      n.toLowerCase().contains('biceps') ||
      n.toLowerCase().contains('glue')
    }

    def bad = suspects.findAll { n -> !n.contains('6.0.0') }

    if (!bad.isEmpty()) {
      throw new GradleException("Non-6.0.0 SDC jars found in BOOT-INF/lib: " + bad)
    }

    println "[verifyBootLibs] OK. SDC-related libs: " + suspects
  }
}

tasks.named('check') {
  dependsOn tasks.named('verifyBootLibs')
}
