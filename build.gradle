plugins {
  id 'java'
  id 'org.springframework.boot' version '3.3.2'
  id 'io.spring.dependency-management' version '1.1.5'
}

// Applies to the Spring app AND to the reusable sdc-core / sdc-jaxb-compat
// libraries. Only repositories and version pins live here - no plugins, so the
// library modules stay free of the Spring Boot plugin.
allprojects {
  group = 'com.medstorm'
  version = '0.0.1-SNAPSHOT'

  repositories {
    mavenCentral()
  }

  configurations.configureEach {
    // remove noisy warning + avoid spring-jcl clashes
    exclude group: 'commons-logging', module: 'commons-logging'

    resolutionStrategy {
      // JAXB pins
      force 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
      force 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
      force 'jakarta.activation:jakarta.activation-api:2.1.3'

      // ✅ hard pin Jetty to 11.0.24 (SDCri dpws-6.0.0 breaks on Jetty 12)
      eachDependency { details ->
        if (details.requested.group == 'org.eclipse.jetty') {
          details.useVersion '11.0.24'
        }
      }
    }
  }
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.2"
    mavenBom "org.eclipse.jetty:jetty-bom:11.0.24"
  }
}

dependencies {
  // The reusable SDC runtime. Everything Spring-free and device-agnostic lives
  // here; this app module is now only the Spring wiring + PainSensor specifics.
  implementation project(':sdc-core')

  implementation('org.springframework.boot:spring-boot-starter-web') {
    exclude group: 'commons-logging', module: 'commons-logging'
  }

  implementation 'javax.inject:javax.inject:1'
  implementation 'javax.annotation:javax.annotation-api:1.3.2'
  implementation 'com.google.code.findbugs:jsr305:3.0.2'
  implementation 'org.jspecify:jspecify:1.0.0'

  // Apache HttpClient 4.x (SDCri DPWS expects org.apache.http.client.HttpClient)
  implementation 'org.apache.httpcomponents:httpclient:4.5.14'
  implementation 'org.apache.httpcomponents:httpcore:4.4.16'

  implementation 'com.google.inject:guice:5.1.0'
  implementation 'com.google.inject.extensions:guice-assistedinject:5.1.0'
  implementation 'com.google.guava:guava:32.1.3-jre'

  // Jetty 11 API used by dpws JettyHttpServerRegistry
  implementation 'org.eclipse.jetty:jetty-util'
  implementation 'org.eclipse.jetty:jetty-server'
  implementation 'org.eclipse.jetty:jetty-http'
  implementation 'org.eclipse.jetty:jetty-io'
  implementation 'org.eclipse.jetty:jetty-security'
  implementation 'org.eclipse.jetty.toolchain:jetty-jakarta-servlet-api:5.0.2'


  implementation 'org.apache.commons:commons-lang3:3.14.0'

  // ✅ REQUIRED because SDCri references org.apache.logging.log4j.kotlin.Logging
      // REQUIRED: SDCri references org.apache.logging.log4j.kotlin.Logging
  implementation 'org.apache.logging.log4j:log4j-api-kotlin:1.5.0'
implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'


  // Jakarta JAXB runtime
  implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
  implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
  implementation 'jakarta.activation:jakarta.activation-api:2.1.3'

  // ✅ SDC 6.0.0 from Maven Central (was: flatDir fileTree over libs/sdc-6.0.0)
  implementation 'org.somda.sdc:common:6.0.0'
  implementation 'org.somda.sdc:dpws:6.0.0'
  implementation 'org.somda.sdc:biceps:6.0.0'
  implementation 'org.somda.sdc:glue:6.0.0'

  // ✅ legacy basics runtime (only this one)
  implementation 'org.jvnet.jaxb2_commons:jaxb2-basics-runtime:0.6.4'

  // compile-time only for javax.* references in shims
  compileOnly 'javax.xml.bind:jaxb-api:2.3.1'
  runtimeOnly 'javax.xml.bind:jaxb-api:2.3.1'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('bootJar') {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ✅ Build-time guard: fail if bootJar contains any non-6.0.0 upstream SDC jars.
// Our own modules (sdc-core, sdc-jaxb-compat) carry the project version, not the
// SDC-ri version, so they are excluded by name rather than by version.
tasks.register('verifyBootLibs') {
  dependsOn tasks.named('bootJar')
  def ownModulePrefixes = rootProject.allprojects.collect { "${it.name}-".toString() }
  doLast {
    def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile
    def libs = zipTree(jarFile).matching { include 'BOOT-INF/lib/*.jar' }.files.collect { it.name }

    def ours = libs.findAll { n -> ownModulePrefixes.any { p -> n.startsWith(p) } }

    def suspects = (libs - ours).findAll { n ->
      n.toLowerCase().contains('sdc') ||
      n.toLowerCase().contains('dpws') ||
      n.toLowerCase().contains('biceps') ||
      n.toLowerCase().contains('glue')
    }

    def bad = suspects.findAll { n -> !n.contains('6.0.0') }
    if (!bad.isEmpty()) {
      throw new GradleException("Non-6.0.0 SDC jars found in BOOT-INF/lib: " + bad)
    }

    println "[verifyBootLibs] OK. Upstream SDC-ri libs: " + suspects.sort()
    println "[verifyBootLibs] Own modules bundled:     " + ours.sort()
  }
}

tasks.named('check') {
  dependsOn tasks.named('verifyBootLibs')
}
